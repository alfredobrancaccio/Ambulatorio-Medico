{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Appuntamenti</h2>
  <a href="/appuntamenti/nuovo" class="btn btn-primary">+ Nuovo</a>
</div>

<table class="table table-striped table-bordered table-hover">
  <thead class="table-primary">
    <tr><th>ID</th><th>Paziente</th><th>Medico</th><th>Esame</th><th>Data</th><th>Azioni</th></tr>
  </thead>
  <tbody>
    {% for a in appuntamenti %}
    <tr>
      <td>{{ a.id }}</td>
      <td>{{ a.paziente }}</td>
      <td>{{ a.medico }}</td>
      <td>{{ a.esame }}</td>
      <td>{{ a.data }}</td>
      <td>
        <a href="/appuntamenti/{{ a.id }}/modifica" class="btn btn-sm btn-warning">Modifica</a>
        <form method="post" action="/appuntamenti/{{ a.id }}/elimina" class="d-inline"
              onsubmit="return confirm('Eliminare questo appuntamento e il suo referto?')">
          <button class="btn btn-sm btn-danger">Elimina</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="6" class="text-center text-muted">Nessun appuntamento.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
