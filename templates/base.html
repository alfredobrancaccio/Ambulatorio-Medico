<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambulatorio Medico</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">Ambulatorio Medico</a>
  <nav>
    <a href="/segreteria">Segreteria</a>
    <a href="/medico">Medico</a>
    <a href="/paziente">Paziente</a>
  </nav>
</header>

<main class="page">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="messages">
      {% for msg in messages %}
      <div class="message {% if '[ERRORE]' in msg %}error{% else %}success{% endif %}">{{ msg }}</div>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
