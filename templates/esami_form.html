{% extends "base.html" %}
{% block content %}
<h2>{% if esame %}Modifica esame{% else %}Nuovo esame{% endif %}</h2>

<form method="post"
      action="{% if esame %}/esami/{{ esame.id }}/modifica{% else %}/esami/nuovo{% endif %}"
      class="mt-3" style="max-width:400px">
  <div class="mb-3">
    <label class="form-label">Nome esame</label>
    <input type="text" name="nome" class="form-control" required
           value="{{ esame.nome if esame else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Reparto</label>
    <input type="text" name="reparto" class="form-control" required
           value="{{ esame.reparto if esame else '' }}">
  </div>
  <button type="submit" class="btn btn-primary">Salva</button>
  <a href="/esami" class="btn btn-secondary ms-2">Annulla</a>
</form>
{% endblock %}
