{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Esami</h2>
  <a href="/esami/nuovo" class="btn btn-primary">+ Nuovo</a>
</div>

<table class="table table-striped table-bordered table-hover">
  <thead class="table-primary">
    <tr><th>ID</th><th>Nome</th><th>Reparto</th><th>Azioni</th></tr>
  </thead>
  <tbody>
    {% for e in esami %}
    <tr>
      <td>{{ e.id }}</td>
      <td>{{ e.nome }}</td>
      <td>{{ e.reparto }}</td>
      <td>
        <a href="/esami/{{ e.id }}/modifica" class="btn btn-sm btn-warning">Modifica</a>
        <form method="post" action="/esami/{{ e.id }}/elimina" class="d-inline"
              onsubmit="return confirm('Eliminare questo esame?')">
          <button class="btn btn-sm btn-danger">Elimina</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted">Nessun esame.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
