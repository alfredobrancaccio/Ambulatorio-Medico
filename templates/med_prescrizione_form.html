{% extends "base.html" %}
{% block content %}
<h2>Nuova prescrizione — Dr. {{ medico.nome }} {{ medico.cognome }}</h2>

<form method="post" class="mt-3" style="max-width:480px">
  <div class="mb-3">
    <label class="form-label">Paziente *</label>
    <select name="paziente_id" class="form-select" required>
      <option value="">-- seleziona --</option>
      {% for p in pazienti %}
      <option value="{{ p.id }}">{{ p.nome }} {{ p.cognome }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Farmaco *</label>
    <input type="text" name="farmaco" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Dose *</label>
    <input type="text" name="dose" class="form-control" required placeholder="es. 100mg/die">
  </div>
  <div class="mb-3">
    <label class="form-label">Data emissione *</label>
    <input type="date" name="data_emissione" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-primary">Salva</button>
  <a href="/medico/{{ medico.id }}" class="btn btn-secondary ms-2">Annulla</a>
</form>
{% endblock %}
