{% extends "base.html" %}
{% block content %}
<h2 style="font-size:22px; font-weight:700; color:#1a3a5c; margin-bottom:4px;">Nuova prescrizione</h2>
<p class="eyebrow mb2">Medico: Dr. {{ medico.nome }} {{ medico.cognome }}</p>
<form method="post" class="form">
  <div class="field">
    <label>Paziente *</label>
    <select name="paziente_id" required>
      <option value="">-- seleziona --</option>
      {% for p in pazienti %}
      <option value="{{ p.id }}">{{ p.nome }} {{ p.cognome }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Farmaco *</label>
    <input type="text" name="farmaco" required>
  </div>
  <div class="field">
    <label>Dose *</label>
    <input type="text" name="dose" required>
  </div>
  <div class="field">
    <label>Data emissione *</label>
    <input type="date" name="data_emissione" required>
  </div>
  <div class="actions">
    <button type="submit" class="button primary">Salva</button>
    <a href="/medico/{{ medico.id }}" class="button secondary">Annulla</a>
  </div>
</form>
{% endblock %}
