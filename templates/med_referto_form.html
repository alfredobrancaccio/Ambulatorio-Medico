{% extends "base.html" %}
{% block content %}
<h2 style="font-size:22px; font-weight:700; color:#1a3a5c; margin-bottom:4px;">Nuovo referto</h2>
<p class="eyebrow mb2">Medico: Dr. {{ medico.nome }} {{ medico.cognome }}</p>
<form method="post" class="form">
  <div class="field">
    <label>Visita *</label>
    <select name="visita_id" required>
      <option value="">-- seleziona --</option>
      {% for v in visite %}
      <option value="{{ v.id }}">
        #{{ v.id }} — {{ v.paziente }} / {{ v.esame }} ({{ v.data }})
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Data rilascio *</label>
    <input type="date" name="data_rilascio" required>
  </div>
  <div class="field">
    <label>Contenuto</label>
    <textarea name="contenuto" rows="5"></textarea>
  </div>
  <div class="actions">
    <button type="submit" class="button primary">Salva</button>
    <a href="/medico/{{ medico.id }}" class="button secondary">Annulla</a>
  </div>
</form>
{% endblock %}
