{% extends "base.html" %}
{% block content %}
<div class="heading">
  <h2>Area Medico — Seleziona profilo</h2>
  <a href="/" class="button secondary small">← Home</a>
</div>
<div class="grid three">
  {% for m in medici %}
  <div class="panel center">
    <div style="font-size:36px; margin-bottom:10px;">🩺</div>
    <h4>Dr. {{ m.nome }} {{ m.cognome }}</h4>
    <p><span class="badge accent">{{ m.reparto }}</span></p>
    <a href="/medico/{{ m.id }}" class="button accent">Accedi</a>
  </div>
  {% else %}
  <p class="muted">Nessun medico registrato.</p>
  {% endfor %}
</div>
{% endblock %}
