{% extends "base.html" %}
{% block content %}

<h2>Medici</h2>

<table class="table table-striped table-bordered">
  <thead class="table-primary">
    <tr><th>ID</th><th>Nome</th><th>Cognome</th><th>Reparto</th></tr>
  </thead>
  <tbody>
    {% for m in medici %}
    <tr>
      <td>{{ m.id }}</td>
      <td>{{ m.nome }}</td>
      <td>{{ m.cognome }}</td>
      <td>{{ m.reparto }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted">Nessun medico.</td></tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
