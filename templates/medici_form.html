{% extends "base.html" %}
{% block content %}
<h2>{% if medico %}Modifica medico{% else %}Nuovo medico{% endif %}</h2>

<form method="post"
      action="{% if medico %}/medici/{{ medico.id }}/modifica{% else %}/medici/nuovo{% endif %}"
      class="mt-3" style="max-width:400px">
  <div class="mb-3">
    <label class="form-label">Nome</label>
    <input type="text" name="nome" class="form-control" required
           value="{{ medico.nome if medico else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Cognome</label>
    <input type="text" name="cognome" class="form-control" required
           value="{{ medico.cognome if medico else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Reparto</label>
    <input type="text" name="reparto" class="form-control" required
           value="{{ medico.reparto if medico else '' }}">
  </div>
  <button type="submit" class="btn btn-primary">Salva</button>
  <a href="/medici" class="btn btn-secondary ms-2">Annulla</a>
</form>
{% endblock %}
