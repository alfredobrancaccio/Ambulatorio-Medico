{% extends "base.html" %}
{% block content %}

<h2>Pazienti</h2>

<table class="table table-striped table-bordered mb-5">
  <thead class="table-primary">
    <tr><th>ID</th><th>Nome</th><th>Cognome</th></tr>
  </thead>
  <tbody>
    {% for p in pazienti %}
    <tr><td>{{ p.id }}</td><td>{{ p.nome }}</td><td>{{ p.cognome }}</td></tr>
    {% else %}
    <tr><td colspan="3" class="text-center text-muted">Nessun paziente.</td></tr>
    {% endfor %}
  </tbody>
</table>

<h4>Aggiungi paziente</h4>
<form method="post" action="/pazienti/nuovo" class="row g-2">
  <div class="col-auto">
    <input type="text" name="nome" class="form-control" placeholder="Nome" required>
  </div>
  <div class="col-auto">
    <input type="text" name="cognome" class="form-control" placeholder="Cognome" required>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-primary">Aggiungi</button>
  </div>
</form>

{% endblock %}
