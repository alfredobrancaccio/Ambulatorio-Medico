{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Pazienti</h2>
  <a href="/pazienti/nuovo" class="btn btn-primary">+ Nuovo</a>
</div>

<table class="table table-striped table-bordered table-hover">
  <thead class="table-primary">
    <tr><th>ID</th><th>Nome</th><th>Cognome</th><th>Azioni</th></tr>
  </thead>
  <tbody>
    {% for p in pazienti %}
    <tr>
      <td>{{ p.id }}</td>
      <td>{{ p.nome }}</td>
      <td>{{ p.cognome }}</td>
      <td>
        <a href="/pazienti/{{ p.id }}/dashboard" class="btn btn-sm btn-info text-white">Dashboard</a>
        <a href="/pazienti/{{ p.id }}/modifica" class="btn btn-sm btn-warning">Modifica</a>
        <form method="post" action="/pazienti/{{ p.id }}/elimina" class="d-inline"
              onsubmit="return confirm('Eliminare il paziente e tutti i dati collegati?')">
          <button class="btn btn-sm btn-danger">Elimina</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted">Nessun paziente.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
