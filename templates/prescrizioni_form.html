{% extends "base.html" %}
{% block content %}
<h2>{% if prescrizione %}Modifica prescrizione{% else %}Nuova prescrizione{% endif %}</h2>

<form method="post"
      action="{% if prescrizione %}/prescrizioni/{{ prescrizione.id }}/modifica{% else %}/prescrizioni/nuovo{% endif %}"
      class="mt-3" style="max-width:450px">

  <div class="mb-3">
    <label class="form-label">Medico</label>
    <select name="medico_id" class="form-select" required>
      <option value="">-- seleziona --</option>
      {% for m in medici %}
      <option value="{{ m.id }}"
        {% if prescrizione and prescrizione.medico_id == m.id %}selected{% endif %}>
        {{ m.nome }} {{ m.cognome }} ({{ m.reparto }})
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Paziente</label>
    <select name="paziente_id" class="form-select" required>
      <option value="">-- seleziona --</option>
      {% for p in pazienti %}
      <option value="{{ p.id }}"
        {% if prescrizione and prescrizione.paziente_id == p.id %}selected{% endif %}>
        {{ p.nome }} {{ p.cognome }}
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Farmaco</label>
    <input type="text" name="farmaco" class="form-control" required
           value="{{ prescrizione.farmaco if prescrizione else '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Dose</label>
    <input type="text" name="dose" class="form-control" required
           placeholder="es. 100mg/die"
           value="{{ prescrizione.dose if prescrizione else '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Data emissione</label>
    <input type="date" name="data_emissione" class="form-control" required
           value="{{ prescrizione.data_emissione if prescrizione else '' }}">
  </div>

  <button type="submit" class="btn btn-primary">Salva</button>
  <a href="/prescrizioni" class="btn btn-secondary ms-2">Annulla</a>
</form>
{% endblock %}
