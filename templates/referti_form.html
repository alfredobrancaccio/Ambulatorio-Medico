{% extends "base.html" %}
{% block content %}
<h2>{% if referto %}Modifica referto{% else %}Nuovo referto{% endif %}</h2>

<form method="post"
      action="{% if referto %}/referti/{{ referto.id }}/modifica{% else %}/referti/nuovo{% endif %}"
      class="mt-3" style="max-width:450px">

  <div class="mb-3">
    <label class="form-label">Appuntamento</label>
    <select name="appuntamento_id" class="form-select" required>
      <option value="">-- seleziona --</option>
      {% for a in appuntamenti %}
      <option value="{{ a.id }}"
        {% if referto and referto.appuntamento_id == a.id %}selected{% endif %}>
        #{{ a.id }} — {{ a.paziente }} / {{ a.esame }} ({{ a.data }})
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Data rilascio</label>
    <input type="date" name="data_rilascio" class="form-control" required
           value="{{ referto.data_rilascio if referto else '' }}">
  </div>

  <button type="submit" class="btn btn-primary">Salva</button>
  <a href="/referti" class="btn btn-secondary ms-2">Annulla</a>
</form>
{% endblock %}
