{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Referti</h2>
  <a href="/referti/nuovo" class="btn btn-primary">+ Nuovo</a>
</div>

<table class="table table-striped table-bordered table-hover">
  <thead class="table-primary">
    <tr><th>ID</th><th>Data rilascio</th><th>Paziente</th><th>Esame</th><th>Azioni</th></tr>
  </thead>
  <tbody>
    {% for r in referti %}
    <tr>
      <td>{{ r.id }}</td>
      <td>{{ r.data_rilascio }}</td>
      <td>{{ r.paziente }}</td>
      <td>{{ r.esame }}</td>
      <td>
        <a href="/referti/{{ r.id }}/modifica" class="btn btn-sm btn-warning">Modifica</a>
        <form method="post" action="/referti/{{ r.id }}/elimina" class="d-inline"
              onsubmit="return confirm('Eliminare questo referto?')">
          <button class="btn btn-sm btn-danger">Elimina</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="5" class="text-center text-muted">Nessun referto.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
