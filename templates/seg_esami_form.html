{% extends "base.html" %}
{% block content %}
<h2 style="font-size:22px; font-weight:700; color:#1a3a5c; margin-bottom:4px;">
  {% if esame %}Modifica esame{% else %}Nuovo esame{% endif %}
</h2>
<form method="post" class="form">
  <div class="field">
    <label>Nome *</label>
    <input type="text" name="nome" required value="{{ esame.nome if esame else '' }}">
  </div>
  <div class="field">
    <label>Reparto *</label>
    <select name="reparto_id" required>
      <option value="">-- seleziona --</option>
      {% for r in reparti %}
      <option value="{{ r.id }}"
        {% if esame and esame.reparto_id == r.id %}selected{% endif %}>
        {{ r.nome }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="actions">
    <button type="submit" class="button primary">Salva</button>
    <a href="/segreteria/esami" class="button secondary">Annulla</a>
  </div>
</form>
{% endblock %}
