{% extends "base.html" %}
{% block content %}
<div class="heading">
  <h2>Esami</h2>
  <div class="row">
    <a href="/segreteria/esami/nuovo" class="button primary small">+ Nuovo</a>
    <a href="/segreteria" class="button secondary small">← Segreteria</a>
  </div>
</div>
<div class="table-wrap">
  <table>
    <thead>
      <tr><th>ID</th><th>Esame</th><th>Reparto</th><th>Azioni</th></tr>
    </thead>
    <tbody>
      {% for e in esami %}
      <tr>
        <td>{{ e.id }}</td><td>{{ e.nome }}</td>
        <td><span class="badge warn">{{ e.reparto }}</span></td>
        <td class="row">
          <a href="/segreteria/esami/{{ e.id }}/modifica" class="button secondary small">Modifica</a>
          <form method="post" action="/segreteria/esami/{{ e.id }}/elimina" style="display:inline"
                onsubmit="return confirm('Eliminare questo esame?')">
            <button class="button danger small">Elimina</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="muted" style="text-align:center">Nessun esame.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
