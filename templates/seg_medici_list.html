{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Medici</h2>
  <div>
    <a href="/segreteria/medici/nuovo" class="btn btn-primary btn-sm">+ Nuovo</a>
    <a href="/segreteria" class="btn btn-secondary btn-sm ms-1">← Segreteria</a>
  </div>
</div>

<table class="table table-striped table-bordered table-hover">
  <thead class="table-success">
    <tr><th>ID</th><th>Nome</th><th>Cognome</th><th>Reparto</th><th>Azioni</th></tr>
  </thead>
  <tbody>
    {% for m in medici %}
    <tr>
      <td>{{ m.id }}</td>
      <td>{{ m.nome }}</td>
      <td>{{ m.cognome }}</td>
      <td><span class="badge bg-success">{{ m.reparto }}</span></td>
      <td>
        <a href="/segreteria/medici/{{ m.id }}/modifica" class="btn btn-sm btn-warning">Modifica</a>
        <form method="post" action="/segreteria/medici/{{ m.id }}/elimina" class="d-inline"
              onsubmit="return confirm('Eliminare questo medico?')">
          <button class="btn btn-sm btn-danger">Elimina</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="5" class="text-center text-muted">Nessun medico.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
