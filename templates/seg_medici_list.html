{% extends "base.html" %}
{% block content %}
<div class="heading">
  <h2>Medici</h2>
  <div class="row">
    <a href="/segreteria/medici/nuovo" class="button primary small">+ Nuovo</a>
    <a href="/segreteria" class="button secondary small">← Segreteria</a>
  </div>
</div>
<div class="table-wrap">
  <table>
    <thead>
      <tr><th>ID</th><th>Nome</th><th>Cognome</th><th>Reparto</th><th>Azioni</th></tr>
    </thead>
    <tbody>
      {% for m in medici %}
      <tr>
        <td>{{ m.id }}</td><td>{{ m.nome }}</td><td>{{ m.cognome }}</td>
        <td><span class="badge accent">{{ m.reparto }}</span></td>
        <td class="row">
          <a href="/segreteria/medici/{{ m.id }}/modifica" class="button secondary small">Modifica</a>
          <form method="post" action="/segreteria/medici/{{ m.id }}/elimina" style="display:inline"
                onsubmit="return confirm('Eliminare questo medico?')">
            <button class="button danger small">Elimina</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="muted" style="text-align:center">Nessun medico.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
