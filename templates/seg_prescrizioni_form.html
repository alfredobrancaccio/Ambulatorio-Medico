{% extends "base.html" %}
{% block content %}
<h2 style="font-size:22px; font-weight:700; color:#1a3a5c; margin-bottom:4px;">
  {% if prescrizione %}Modifica prescrizione{% else %}Nuova prescrizione{% endif %}
</h2>
<form method="post" class="form">
  <div class="field">
    <label>Medico *</label>
    <select name="medico_id" required>
      <option value="">-- seleziona --</option>
      {% for m in medici %}
      <option value="{{ m.id }}"
        {% if prescrizione and prescrizione.medico_id == m.id %}selected{% endif %}>
        Dr. {{ m.nome }} {{ m.cognome }} ({{ m.reparto }})
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Paziente *</label>
    <select name="paziente_id" required>
      <option value="">-- seleziona --</option>
      {% for p in pazienti %}
      <option value="{{ p.id }}"
        {% if prescrizione and prescrizione.paziente_id == p.id %}selected{% endif %}>
        {{ p.nome }} {{ p.cognome }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Farmaco *</label>
    <input type="text" name="farmaco" required
           value="{{ prescrizione.farmaco if prescrizione else '' }}">
  </div>
  <div class="field">
    <label>Dose *</label>
    <input type="text" name="dose" required
           value="{{ prescrizione.dose if prescrizione else '' }}">
  </div>
  <div class="field">
    <label>Data emissione *</label>
    <input type="date" name="data_emissione" required
           value="{{ prescrizione.data_emissione if prescrizione else '' }}">
  </div>
  <div class="actions">
    <button type="submit" class="button primary">Salva</button>
    <a href="/segreteria/prescrizioni" class="button secondary">Annulla</a>
  </div>
</form>
{% endblock %}
