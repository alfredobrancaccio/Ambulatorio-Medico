{% extends "base.html" %}
{% block content %}
<h2>{% if referto %}Modifica referto{% else %}Nuovo referto{% endif %}</h2>

<form method="post" class="mt-3" style="max-width:520px">
  <div class="mb-3">
    <label class="form-label">Visita *</label>
    <select name="visita_id" class="form-select" required>
      <option value="">-- seleziona --</option>
      {% for v in visite %}
      <option value="{{ v.id }}"
        {% if referto and referto.visita_id == v.id %}selected{% endif %}>
        #{{ v.id }} — {{ v.paziente }} / {{ v.esame }} ({{ v.data }})
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Data rilascio *</label>
    <input type="date" name="data_rilascio" class="form-control" required
           value="{{ referto.data_rilascio if referto else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Contenuto</label>
    <textarea name="contenuto" class="form-control" rows="4">{{ referto.contenuto if referto else '' }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">Salva</button>
  <a href="/segreteria/referti" class="btn btn-secondary ms-2">Annulla</a>
</form>
{% endblock %}
