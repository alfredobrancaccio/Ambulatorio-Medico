{% extends "base.html" %}
{% block content %}
<h2 style="font-size:22px; font-weight:700; color:#1a3a5c; margin-bottom:4px;">
  {% if referto %}Modifica referto{% else %}Nuovo referto{% endif %}
</h2>
<form method="post" class="form">
  <div class="field">
    <label>Visita *</label>
    <select name="visita_id" required>
      <option value="">-- seleziona --</option>
      {% for v in visite %}
      <option value="{{ v.id }}"
        {% if referto and referto.visita_id == v.id %}selected{% endif %}>
        #{{ v.id }} — {{ v.paziente }} / {{ v.esame }} ({{ v.data }})
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Data rilascio *</label>
    <input type="date" name="data_rilascio" required
           value="{{ referto.data_rilascio if referto else '' }}">
  </div>
  <div class="field">
    <label>Contenuto</label>
    <textarea name="contenuto" rows="4">{{ referto.contenuto if referto else '' }}</textarea>
  </div>
  <div class="actions">
    <button type="submit" class="button primary">Salva</button>
    <a href="/segreteria/referti" class="button secondary">Annulla</a>
  </div>
</form>
{% endblock %}
