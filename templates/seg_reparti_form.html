{% extends "base.html" %}
{% block content %}
<h2 style="font-size:22px; font-weight:700; color:#1a3a5c; margin-bottom:4px;">
  {% if reparto %}Modifica reparto{% else %}Nuovo reparto{% endif %}
</h2>
<form method="post" class="form">
  <div class="field">
    <label>Nome *</label>
    <input type="text" name="nome" required value="{{ reparto.nome if reparto else '' }}">
  </div>
  <div class="actions">
    <button type="submit" class="button primary">Salva</button>
    <a href="/segreteria/reparti" class="button secondary">Annulla</a>
  </div>
</form>
{% endblock %}
