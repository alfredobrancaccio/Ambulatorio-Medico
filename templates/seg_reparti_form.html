{% extends "base.html" %}
{% block content %}
<h2>{% if reparto %}Modifica reparto{% else %}Nuovo reparto{% endif %}</h2>

<form method="post" class="mt-3" style="max-width:400px">
  <div class="mb-3">
    <label class="form-label">Nome *</label>
    <input type="text" name="nome" class="form-control" required
           value="{{ reparto.nome if reparto else '' }}">
  </div>
  <button type="submit" class="btn btn-primary">Salva</button>
  <a href="/segreteria/reparti" class="btn btn-secondary ms-2">Annulla</a>
</form>
{% endblock %}
