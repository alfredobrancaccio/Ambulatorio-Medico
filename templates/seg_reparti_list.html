{% extends "base.html" %}
{% block content %}
<div class="heading">
  <h2>Reparti</h2>
  <div class="row">
    <a href="/segreteria/reparti/nuovo" class="button primary small">+ Nuovo</a>
    <a href="/segreteria" class="button secondary small">← Segreteria</a>
  </div>
</div>
<div class="table-wrap">
  <table>
    <thead>
      <tr><th>ID</th><th>Nome</th><th>Azioni</th></tr>
    </thead>
    <tbody>
      {% for r in reparti %}
      <tr>
        <td>{{ r.id }}</td><td>{{ r.nome }}</td>
        <td class="row">
          <a href="/segreteria/reparti/{{ r.id }}/modifica" class="button secondary small">Modifica</a>
          <form method="post" action="/segreteria/reparti/{{ r.id }}/elimina" style="display:inline"
                onsubmit="return confirm('Eliminare questo reparto?')">
            <button class="button danger small">Elimina</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="muted" style="text-align:center">Nessun reparto.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
