{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Reparti</h2>
  <div>
    <a href="/segreteria/reparti/nuovo" class="btn btn-primary btn-sm">+ Nuovo</a>
    <a href="/segreteria" class="btn btn-secondary btn-sm ms-1">← Segreteria</a>
  </div>
</div>

<table class="table table-striped table-bordered table-hover">
  <thead class="table-secondary">
    <tr><th>ID</th><th>Nome</th><th>Azioni</th></tr>
  </thead>
  <tbody>
    {% for r in reparti %}
    <tr>
      <td>{{ r.id }}</td>
      <td>{{ r.nome }}</td>
      <td>
        <a href="/segreteria/reparti/{{ r.id }}/modifica" class="btn btn-sm btn-warning">Modifica</a>
        <form method="post" action="/segreteria/reparti/{{ r.id }}/elimina" class="d-inline"
              onsubmit="return confirm('Eliminare questo reparto?')">
          <button class="btn btn-sm btn-danger">Elimina</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="3" class="text-center text-muted">Nessun reparto.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
