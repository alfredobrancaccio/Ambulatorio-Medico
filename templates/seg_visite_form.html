{% extends "base.html" %}
{% block content %}
<h2 style="font-size:22px; font-weight:700; color:#1a3a5c; margin-bottom:4px;">
  {% if visita %}Modifica visita{% else %}Nuova visita{% endif %}
</h2>
<form method="post" class="form">
  <div class="field">
    <label>Paziente *</label>
    <select name="paziente_id" required>
      <option value="">-- seleziona --</option>
      {% for p in pazienti %}
      <option value="{{ p.id }}"
        {% if visita and visita.paziente_id == p.id %}selected{% endif %}>
        {{ p.nome }} {{ p.cognome }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Medico *</label>
    <select id="sel-medico" name="medico_id" required>
      <option value="">-- seleziona --</option>
      {% for m in medici %}
      <option value="{{ m.id }}" data-reparto="{{ m.reparto_id }}"
        {% if visita and visita.medico_id == m.id %}selected{% endif %}>
        Dr. {{ m.nome }} {{ m.cognome }} ({{ m.reparto }})
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Esame *</label>
    <select id="sel-esame" name="esame_id" required>
      <option value="">-- seleziona medico prima --</option>
      {% for e in esami %}
      <option value="{{ e.id }}" data-reparto="{{ e.reparto_id }}"
        {% if visita and visita.esame_id == e.id %}selected{% endif %}>
        {{ e.nome }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Data *</label>
    <input type="date" name="data" required value="{{ visita.data if visita else '' }}">
  </div>
  <div class="field">
    <label>Note</label>
    <input type="text" name="note" value="{{ visita.note if visita else '' }}">
  </div>
  <div class="actions">
    <button type="submit" class="button primary">Salva</button>
    <a href="/segreteria/visite" class="button secondary">Annulla</a>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script>
const selMedico  = document.getElementById("sel-medico");
const selEsame   = document.getElementById("sel-esame");
const tuttiEsami = Array.from(selEsame.options).slice(1);

function filtraEsami() {
  const repartoId = selMedico.options[selMedico.selectedIndex]?.dataset.reparto;
  const curVal    = selEsame.value;
  selEsame.innerHTML = "";
  selEsame.add(new Option("-- seleziona --", ""));
  tuttiEsami.forEach(opt => {
    if (!repartoId || opt.dataset.reparto === repartoId)
      selEsame.add(opt.cloneNode(true));
  });
  selEsame.value = curVal;
}

selMedico.addEventListener("change", filtraEsami);
document.addEventListener("DOMContentLoaded", filtraEsami);
</script>
{% endblock %}
