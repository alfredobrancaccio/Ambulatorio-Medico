{% extends "base.html" %}
{% block content %}
<h2>{% if visita %}Modifica visita{% else %}Nuova visita{% endif %}</h2>

<form method="post" class="mt-3" style="max-width:520px">

  <div class="mb-3">
    <label class="form-label">Paziente *</label>
    <select name="paziente_id" class="form-select" required>
      <option value="">-- seleziona --</option>
      {% for p in pazienti %}
      <option value="{{ p.id }}"
        {% if visita and visita.paziente_id == p.id %}selected{% endif %}>
        {{ p.nome }} {{ p.cognome }}
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Medico *</label>
    <select id="sel-medico" name="medico_id" class="form-select" required>
      <option value="">-- seleziona --</option>
      {% for m in medici %}
      <option value="{{ m.id }}" data-reparto="{{ m.reparto_id }}"
        {% if visita and visita.medico_id == m.id %}selected{% endif %}>
        Dr. {{ m.nome }} {{ m.cognome }} ({{ m.reparto }})
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Esame *</label>
    <select id="sel-esame" name="esame_id" class="form-select" required>
      <option value="">-- seleziona medico prima --</option>
      {% for e in esami %}
      <option value="{{ e.id }}" data-reparto="{{ e.reparto_id }}"
        {% if visita and visita.esame_id == e.id %}selected{% endif %}>
        {{ e.nome }}
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Data *</label>
    <input type="date" name="data" class="form-control" required
           value="{{ visita.data if visita else '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Note</label>
    <input type="text" name="note" class="form-control"
           value="{{ visita.note if visita else '' }}">
  </div>

  <button type="submit" class="btn btn-primary">Salva</button>
  <a href="/segreteria/visite" class="btn btn-secondary ms-2">Annulla</a>
</form>
{% endblock %}

{% block scripts %}
<script>
const selMedico = document.getElementById("sel-medico");
const selEsame  = document.getElementById("sel-esame");
const tuttiEsami = Array.from(selEsame.options).slice(1);

function filtraEsami() {
  const repartoId = selMedico.options[selMedico.selectedIndex]?.dataset.reparto;
  const curVal    = selEsame.value;
  selEsame.innerHTML = "";
  const vuota = new Option("-- seleziona --", "");
  selEsame.add(vuota);
  tuttiEsami.forEach(opt => {
    if (!repartoId || opt.dataset.reparto === repartoId) {
      selEsame.add(opt.cloneNode(true));
    }
  });
  selEsame.value = curVal;
}

selMedico.addEventListener("change", filtraEsami);
document.addEventListener("DOMContentLoaded", filtraEsami);
</script>
{% endblock %}
